services:
  livekit:
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip=192.168.1.20"]
    ports:
      - "7880:7880"       # HTTP + WebSocket signaling
      - "7881:7881"       # RTC TCP fallback
      - "7882:7882/udp"   # RTC UDP mux (single port, --dev default)

  relay:
    build: ./server
    ports:
      - "8080:8080"
      - "8081:8081"   # raw TCP ingest for the OpenPlanet plugin
    environment:
      LIVEKIT_INTERNAL_URL: "http://livekit:7880"
      LIVEKIT_PUBLIC_WS_URL: "ws://localhost:7880"
      LIVEKIT_API_KEY: "devkey"
      LIVEKIT_API_SECRET: "secret"
      ROOM_NAME: "onzsm"
    depends_on:
      - livekit
    volumes:
      - ./server/public:/app/public
      - ./server/src:/app/src

  simulator:
    build: ./tools
    profiles: ["tools"]
    environment:
      RELAY_WS_URL: "ws://relay:8080/ingest"
    depends_on:
      - relay
