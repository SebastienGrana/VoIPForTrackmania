<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OnZVoIP — admin</title>
<script>
  // Before the first paint, or a dark flash lands on a page somebody chose to
  // keep light — and this one is stared at for a whole evening.
  try {
    const saved = localStorage.getItem('onz.theme');
    const theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  } catch { document.documentElement.setAttribute('data-theme', 'dark'); }
</script>
<style>
  /* Every colour goes through a variable, including the banners: a hardcoded
     #3b1f1f is invisible red-on-red the moment the page turns light. */
  :root, :root[data-theme="dark"] {
    --bg: #14161a; --panel: #1c1f25; --line: #2b3038;
    --fg: #e6e8ec; --dim: #8b93a1; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
    --banner-bg: #3b1f1f; --banner-fg: #ffd7d7;
    --warnbanner-bg: #3a2f10; --warnbanner-fg: #ffe7b3; --warnbanner-who: #fff;
    --spark-area: rgba(74, 222, 128, .18);
    --priv-fg: #ffb454; --priv-line: #6b4a12;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  :root[data-theme="light"] {
    --bg: #f4f6f8; --panel: #ffffff; --line: #d7dce3;
    --fg: #1b1f26; --dim: #5d6673; --ok: #15803d; --warn: #a16207; --bad: #b91c1c;
    --banner-bg: #fdeaea; --banner-fg: #7f1d1d;
    --warnbanner-bg: #fdf4dd; --warnbanner-fg: #78350f; --warnbanner-who: #3b2606;
    --spark-area: rgba(21, 128, 61, .14);
    --priv-fg: #9a5b00; --priv-line: #e2c48a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font-size: 13px; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  h2 { font-size: 13px; margin: 0 0 8px; color: var(--dim); font-weight: 600;
       text-transform: uppercase; letter-spacing: .06em; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .sub { color: var(--dim); font-size: 12px; }
  #stale { color: var(--bad); font-weight: 700; }
  /* Pushed to the right end of the header: they are settings, not readings. */
  .prefs { margin-left: auto; display: flex; gap: 6px; align-items: center; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .card b { display: block; font-size: 26px; line-height: 1.1; font-weight: 700; }
  .card span { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .card.hl b { color: var(--ok); }
  .card.warn b { color: var(--warn); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; min-width: 0; }
  .wide { grid-column: 1 / -1; }

  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th { text-align: left; color: var(--dim); font-weight: 600; padding: 3px 8px 6px 0; white-space: nowrap; }
  td { padding: 3px 8px 3px 0; border-top: 1px solid var(--line); white-space: nowrap; }
  td.login { font-weight: 600; }
  .empty { color: var(--dim); font-style: italic; padding: 6px 0; }

  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .dim { color: var(--dim); }

  #events { max-height: 340px; overflow-y: auto; font-size: 12px; line-height: 1.55; }
  #events div { border-top: 1px solid var(--line); padding: 2px 0; }
  #events .ev { display: inline-block; min-width: 152px; font-weight: 600; }

  .report { border-top: 1px solid var(--line); padding: 8px 0; }
  .report p { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; }
  /* Estompé plutôt que masqué : un signalement traité reste consultable, mais
     l'œil doit tomber d'abord sur ceux dont personne ne s'est occupé. */
  .report.done { opacity: .45; }
  .banner { background: var(--banner-bg); border: 1px solid var(--bad); color: var(--banner-fg);
            border-radius: 6px; padding: 8px 12px; margin-bottom: 14px; }
  .warnbanner { background: var(--warnbanner-bg); border-color: var(--warn); color: var(--warnbanner-fg); }
  .warnbanner b { display: inline-block; margin-right: 6px; }
  .warnbanner .who { font-weight: 700; color: var(--warnbanner-who); }
  .warnbanner div + div { margin-top: 4px; }

  .rooms { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .room { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .room h3 { margin: 0 0 4px; font-size: 12px; font-weight: 700; word-break: break-all; }
  .room .who { display: inline-block; margin: 1px 6px 1px 0; }
  .room .half { color: var(--warn); }
  .room .ghost { color: var(--bad); }

  #spark { width: 100%; height: 90px; display: block; }
  #spark .area { fill: var(--spark-area); }
  #spark .line { fill: none; stroke: var(--ok); stroke-width: 2; }
  #spark .line2 { fill: none; stroke: var(--dim); stroke-width: 1; stroke-dasharray: 3 3; }

  .tools { display: flex; gap: 8px; align-items: center; margin: -4px 0 8px; flex-wrap: wrap; }
  .tools input { flex: 1 1 160px; min-width: 0; background: var(--bg); color: var(--fg);
                 border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px;
                 font: inherit; font-size: 12px; }
  .tools a { color: var(--dim); font-size: 12px; text-decoration: none; border: 1px solid var(--line);
             border-radius: 4px; padding: 4px 8px; }
  .tools a:hover { color: var(--fg); }

  /* Tabs: the page outgrew one screen. Counters and banners stay above them —
     those are the reason the page is open at all and must never be a click away. */
  nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
  nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim);
               font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer;
               text-transform: uppercase; letter-spacing: .05em; }
  nav button:hover { color: var(--fg); }
  nav button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--ok); }
  nav .badge { color: var(--warn); font-weight: 700; }
  .panel[hidden] { display: none; }
  .panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; align-items: start; }

  button.act { background: var(--bg); color: var(--fg); border: 1px solid var(--line);
               border-radius: 4px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  button.act:hover { border-color: var(--fg); }
  button.act.on { border-color: var(--ok); color: var(--ok); }
  button.act.danger:hover { border-color: var(--bad); color: var(--bad); }
  button.act[disabled] { opacity: .4; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .row .lbl { min-width: 150px; }
  .note { color: var(--dim); font-size: 12px; margin: 4px 0 12px; line-height: 1.5; }
  .kick { font-size: 11px; padding: 1px 6px; margin-left: 4px; }
  .lnk { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .lnk:last-child { border-bottom: 0; }
  .lnk-u { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 3px 0; }
  .lnk-u a { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .lnk-u code { font-size: 12px; color: var(--dim); }
  .lnk .note { margin: 0; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .tag.priv { color: var(--priv-fg); border-color: var(--priv-line); }
  button.copy { font-size: 11px; padding: 1px 8px; }
  .team { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .team:last-child { border-bottom: 0; }
  .team .nm { min-width: 120px; font-weight: 600; }
  .sw { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .team select { background: transparent; color: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>OnZVoIP — admin</h1>
  <span class="sub" id="meta" data-i18n="loading">chargement…</span>
  <span id="stale"></span>
  <span class="prefs">
    <button class="act" id="langBtn" type="button"></button>
    <button class="act" id="themeBtn" type="button"></button>
  </span>
</header>

<div id="debugBanner" class="banner" hidden data-i18n-html="debugBanner"></div>

<div class="cards" id="cards"></div>

<div id="unpaired" class="banner warnbanner" hidden></div>

<div id="lkBanner" class="banner" hidden></div>

<nav id="tabs" role="tablist">

  <button data-tab="rooms" role="tab" aria-selected="false" data-i18n="tab.rooms">Salons</button>
  <button data-tab="reports" role="tab" aria-selected="false"><span data-i18n="tab.reports">Signalements</span> <span class="badge" id="tabReports"></span></button>
  <button data-tab="log" role="tab" aria-selected="false" data-i18n="tab.log">Journal</button>
  <button data-tab="bots" role="tab" aria-selected="false" data-i18n="tab.bots">Bots</button>
  <button data-tab="teams" role="tab" aria-selected="false" data-i18n="tab.teams">Équipes</button>
  <button data-tab="links" role="tab" aria-selected="false" data-i18n="tab.links">Liens</button>
  <button data-tab="actions" role="tab" aria-selected="false" data-i18n="tab.actions">Actions</button>
</nav>

<div class="panel" id="tab-live">
  <section class="wide">
    <h2 data-i18n="h.last10">10 dernières minutes</h2>
    <div class="scroll"><svg id="spark" viewBox="0 0 600 90" preserveAspectRatio="none" role="img"></svg></div>
    <div class="sub" id="sparkLegend"></div>
  </section>

  <section>
    <h2 data-i18n="h.plugins">Plugins connectés (jeu)</h2>
    <div class="scroll"><table id="plugins"></table></div>
  </section>

  <section>
    <h2 data-i18n="h.browsers">Navigateurs connectés (voix)</h2>
    <div class="scroll"><table id="browsers"></table></div>
  </section>

  <section>
    <h2 data-i18n="h.reconnects">Reconnexions (10 min)</h2>
    <div class="scroll"><table id="reconnects"></table></div>
  </section>
</div>

<div class="panel" id="tab-rooms" hidden>
  <section class="wide">
    <h2 data-i18n="h.rooms">Salons</h2>
    <div id="rooms"></div>
  </section>
</div>

<div class="panel" id="tab-reports" hidden>
  <section class="wide">
    <h2 data-i18n="h.reports">Problèmes signalés</h2>
    <div id="reports"></div>
  </section>
</div>

<div class="panel" id="tab-log" hidden>
  <section class="wide">
    <h2 data-i18n="h.events">Événements (plus récent en haut)</h2>
    <div class="tools">
      <input id="filter" type="search" data-i18n-ph="filterPlaceholder" autocomplete="off">
      <span class="sub" id="filterCount"></span>
      <a href="/admin/events.log" download data-i18n="fullLog">⬇ journal complet</a>
    </div>
    <div id="events"></div>
  </section>
</div>

<div class="panel" id="tab-bots" hidden>
  <section class="wide">
    <h2 data-i18n="h.bots">Bots de test</h2>
    <p class="note" data-i18n="note.bots"></p>
    <div id="botsUI" class="empty"></div>
  </section>
</div>

<div class="panel" id="tab-teams" hidden>
  <section class="wide">
    <h2 data-i18n="h.teams">Équipes</h2>
    <p class="note" data-i18n="note.teams"></p>
    <div id="teamsUI" class="empty"></div>
  </section>
</div>

<div class="panel" id="tab-links" hidden>
  <section class="wide">
    <h2 data-i18n="h.links">Liens de l'application</h2>
    <p class="note" data-i18n="note.links"></p>
    <div id="links"></div>
  </section>
</div>

<div class="panel" id="tab-actions" hidden>
  <section class="wide">
    <h2 data-i18n="h.actions">Actions</h2>
    <p class="note" data-i18n="note.actions"></p>
    <div id="actionsUI" class="empty"></div>
  </section>
  <section class="wide">
    <h2 data-i18n="h.blocked">Joueurs bloqués</h2>
    <p class="note" data-i18n="note.blocked"></p>
    <div id="blockedUI"></div>
  </section>
  <section class="wide">
    <h2 data-i18n="h.bans">Liste noire</h2>
    <p class="note" data-i18n="note.bans"></p>
    <!-- Static, not redrawn by the poll: this is the one control on the page
         you type into, and rebuilding it every five seconds would eat a login
         halfway through being entered. Only the list below is redrawn. -->
    <div class="tools" id="banForm" hidden>
      <input id="banLogin" type="text" data-i18n-ph="banLoginPh" autocomplete="off" spellcheck="false" maxlength="64">
      <input id="banReason" type="text" data-i18n-ph="banReasonPh" autocomplete="off" maxlength="200">
      <button class="act danger" id="banBtn" type="button" data-i18n="banAdd">bannir</button>
    </div>
    <div id="bansUI"></div>
  </section>
</div>

// draws no control it cannot actually fire.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
));

let lang = (() => {
  try {
    const saved = localStorage.getItem('onz.lang');
    if (saved === 'fr' || saved === 'en') return saved;
  } catch {}
  return String(navigator.language || '').toLowerCase().startsWith('fr') ? 'fr' : 'en';
})();

// Falls back to French rather than to the key: a missing string should read as
// an untranslated label, never as `h.blocked` on a page somebody is watching.
const t = (key, ...args) => {
  const v = STRINGS[lang][key] ?? STRINGS.fr[key] ?? key;
  return typeof v === 'function' ? v(...args) : v;
};
const locale = () => (lang === 'fr' ? 'fr-FR' : 'en-GB');
const time = (ts) => new Date(ts).toLocaleTimeString(locale());

function applyStatic() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll('[data-i18n-html]')) el.innerHTML = t(el.dataset.i18nHtml);
  for (const el of document.querySelectorAll('[data-i18n-ph]')) el.placeholder = t(el.dataset.i18nPh);
  $('langBtn').textContent = t('langBtn');
  $('langBtn').title = t('langTitle');
}

$('langBtn').addEventListener('click', () => {
  lang = lang === 'fr' ? 'en' : 'fr';
  try { localStorage.setItem('onz.lang', lang); } catch {}
  applyStatic();
  // The two memoised panels compare against their last *payload*, which has not
  // changed just because the language did — clearing the keys is what makes the
  // switch land on them too.
  actionsDrawn = null;
  teamsDrawn = null;
  renderReports(lastCanAct);
  renderEvents();
  poll();
});

// --- thème -------------------------------------------------------------------
// Dark by default because that is what a dashboard left open all evening should
// be, light because a shared screen in a lit room is not that evening.
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  $('themeBtn').textContent = theme === 'dark' ? '☀' : '☾';
  $('themeBtn').title = theme === 'dark' ? 'Light' : 'Dark';
}
$('themeBtn').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('onz.theme', next); } catch {}
  applyTheme(next);
});
applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
applyStatic();

// A player is only really "in" when the game half and the tab half are both
// up, so the ages are graded rather than shown raw: green = sending, amber =
// alive but quiet (menu, or plugin wedged), red = should have dropped by now.
function ageClass(seconds) {
  if (seconds === null || seconds === undefined) return 'dim';
  if (seconds <= 5) return 'ok';
  if (seconds <= 30) return 'warn';
  return 'bad';
}

function fmtAge(seconds) {
  if (seconds === null || seconds === undefined) return '—';
  if (seconds < 60) return seconds + 's';
  if (seconds < 3600) return Math.floor(seconds / 60) + 'm' + String(seconds % 60).padStart(2, '0');
  return Math.floor(seconds / 3600) + 'h' + String(Math.floor(seconds % 3600 / 60)).padStart(2, '0');
}

function table(el, cols, rows, render) {
  if (!rows.length) { el.innerHTML = '<tr><td class="empty">' + t('nobody') + '</td></tr>'; return; }
  el.innerHTML = '<tr>' + cols.map((c) => '<th>' + c + '</th>').join('') + '</tr>'
    + rows.map(render).join('');
}

let lastOk = 0;
let lastCanAct = false; // last known ADMIN_ACTIONS state, so a language switch can redraw

// --- alerte nouveau signalement ---------------------------------------------
// A report is someone saying "I can't hear anyone" mid-event: it is the one
// thing on this page that must not wait for the next glance.
const BASE_TITLE = document.title;
let lastReportTs = null;   // null until the first poll, so a reload never beeps
let allReports = [];       // newest first, as the relay sends them
let reportCursor = null;   // relay-side revision; null asks for the full list
let pendingReports = 0;    // unhandled, counted from the relay's own state

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.36);
    setTimeout(() => ctx.close(), 600);
  } catch { /* autoplay bloqué : le titre suffit */ }
}

function noteReports(reports) {
  const newest = reports.length ? reports[0].ts : null;
  if (lastReportTs !== null && newest !== null && newest !== lastReportTs) beep();
  lastReportTs = newest;
  // Counted from the relay rather than tallied here: with the page open on two
  // screens, a local counter tells each of them a different number, and the
  // one that matters is "how many has nobody dealt with yet".
  pendingReports = reports.filter((r) => !r.handled).length;
  paintPending();
}

// The counter lives in two places on purpose: the tab title for when the page
// is in a background window, the nav badge for when it is on screen but you
// are looking at another section.
function paintPending() {
  document.title = pendingReports ? '(' + pendingReports + ') ⚠ ' + BASE_TITLE : BASE_TITLE;
  $('tabReports').textContent = pendingReports ? '(' + pendingReports + ')' : '';
}

// Opening the tab used to be the acknowledgement. It stopped being enough the
// moment reports outlived a glance: "I have seen it" and "somebody has dealt
// with it" are different facts, and only the second one should clear a badge
// that two people are looking at. That is the « traité » button below.

function renderReports(canAct) {
  if (!allReports.length) { $('reports').innerHTML = '<div class="empty">' + t('noReports') + '</div>'; return; }
  $('reports').innerHTML = allReports.map((r) =>
    '<div class="report' + (r.handled ? ' done' : '') + '">'
    + '<span class="dim">' + time(r.ts)
    + '</span> <b>' + esc(r.login || t('anonymous')) + '</b> '
    + '<span class="dim">' + esc(r.version || t('noVersion')) + ' · ' + esc(r.room || t('noRoom'))
    + (r.state ? ' · ' + esc(r.state) : '') + '</span> '
    + (canAct
      ? '<button class="act' + (r.handled ? ' on' : '') + '" data-report="' + r.id
        + '" data-handled="' + (r.handled ? '0' : '1') + '"'
        + ' title="' + (r.handled ? t('handledHint') : t('markHandled')) + '">'
        + (r.handled ? t('handledDone') : t('handled')) + '</button>'
      : (r.handled ? '<span class="ok">' + t('handledDone') + '</span>' : ''))
    + '<p>' + esc(r.message) + '</p></div>').join('');
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-report]');
  if (!btn) return;
  act('report', { id: Number(btn.dataset.report), handled: btn.dataset.handled === '1' });
});

// --- onglets -----------------------------------------------------------------
// Remembered across reloads: during an event this page gets refreshed a lot,
// and landing back on Monitoring every time is exactly wrong when you were
// watching the log.
// Read defensively: a browser with storage blocked throws here, and an
// exception at this point kills the rest of the script — the whole page.
let currentTab = 'live';
try { currentTab = localStorage.getItem('onz.tab') || 'live'; } catch {}
function selectTab(name) {
  if (!$('tab-' + name)) name = 'live';
  currentTab = name;
  try { localStorage.setItem('onz.tab', name); } catch {}
  for (const btn of document.querySelectorAll('#tabs button')) {
    btn.setAttribute('aria-selected', String(btn.dataset.tab === name));
  }
  for (const panel of document.querySelectorAll('.panel')) {
    panel.hidden = panel.id !== 'tab-' + name;
  }
}
$('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');
  if (btn) selectTab(btn.dataset.tab);
});
selectTab(currentTab);

// --- actions -----------------------------------------------------------------
// Every button goes through here so a failure is visible instead of silent,
// and so the next poll (200 ms later) is what redraws the state — the buttons
// never guess at what the relay did.
async function act(path, body) {
  try {
    const res = await fetch('/admin/actions/' + path, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    setTimeout(poll, 200);
    // Returned rather than discarded so a caller can react to something the
    // next poll cannot show — a ban that applied but could not be written to
    // disk is the case that exists.
    return await res.json().catch(() => null);
  } catch (err) {
    $('stale').textContent = t('actionRefused', err.message);
    return null;
  }
}

let actionsDrawn = null; // last state drawn, so a redraw never lands mid-click
let actionState = { enabled: false };
let debugOn = false;

// Delegated, attached once: both panels are rebuilt from innerHTML whenever
// the relay state changes, and per-button listeners would pile up.
document.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  if (btn.dataset.act === 'debug') {
    if (!confirm(debugOn ? t('debugOffConfirm') : t('debugOnConfirm'))) return;
    act('debug', { on: !debugOn });
  } else if (btn.dataset.act === 'secretSet') {
    // prompt() and not a form field on purpose: the value must not sit in the
    // DOM of a page that stays open on a stream or a shared screen all evening.
    const s = prompt(t('secretPrompt'), '');
    if (s === null) return;
    const v = s.trim();
    if (!/^[\x21-\x7e]{8,128}$/.test(v)) {
      $('stale').textContent = t('secretRefused');
      return;
    }
    act('secret', { secret: v });
  } else if (btn.dataset.act === 'secretClear') {
    if (!confirm(t('secretClearConfirm'))) return;
    act('secret', { secret: '' });
  } else if (btn.dataset.act === 'autokick') {
    act('autokick', { on: !actionState.autoKick });
  } else if (btn.dataset.act === 'bots') {
    act('bots', { count: Number(btn.dataset.count) });
  } else if (btn.dataset.act === 'teamCreate') {
    const name = prompt(t('teamNamePrompt'), '');
    if (name === null) return;
    act('teams', { op: 'create', name });
  } else if (btn.dataset.act === 'teamRemove') {
    act('teams', { op: 'remove', id: btn.dataset.id });
  } else if (btn.dataset.act === 'teamVoice') {
    const team = teamsState.teams.find((t2) => t2.id === btn.dataset.id);
    act('teams', { op: 'voice', id: btn.dataset.id, on: !(team && team.voice) });
  } else if (btn.dataset.act === 'teamAuto') {
    // Destructive: it throws away the teams already on screen, which during an
    // event is somebody's careful hand-sorting.
    if (teamsState.teams.length && !confirm(t('teamAutoConfirm'))) return;
    act('teams', { op: 'auto', count: Number(btn.dataset.count) });
  } else if (btn.dataset.act === 'teamClear') {
    if (!confirm(t('teamClearConfirm'))) return;
    act('teams', { op: 'clear' });
  }
});

function renderActions(a, debug) {
  actionState = a;
  debugOn = debug;
  const key = JSON.stringify(a) + debug;
  if (key === actionsDrawn) return;
  actionsDrawn = key;

  if (!a.enabled) {
    const off = t('actionsOff');
    $('actionsUI').className = 'empty'; $('actionsUI').textContent = off;
    $('botsUI').className = 'empty'; $('botsUI').textContent = off;
    return;
  }

  $('actionsUI').className = '';
  $('actionsUI').innerHTML =
    '<div class="row"><span class="lbl">' + t('debugLabel') + '</span>'
    + '<button class="act danger ' + (debug ? 'on' : '') + '" data-act="debug">'
    + (debug ? t('debugOnBtn') : t('debugOffBtn')) + '</button>'
    + '<span class="sub">' + t('debugSub') + '</span></div>'
    + '<div class="row"><span class="lbl">' + t('autoKickLabel') + '</span>'
    + '<button class="act ' + (a.autoKick ? 'on' : '') + '" data-act="autokick">'
    + (a.autoKick ? t('on') : t('off')) + '</button>'
    + '<span class="sub">' + t('autoKickSub') + '</span></div>'
    + '<div class="row"><span class="lbl">' + t('secretLabel') + '</span>'
    + '<button class="act ' + (a.tcpSecret ? 'on' : '') + '" data-act="secretSet">'
    + (a.tcpSecret ? t('secretSet') : t('secretNone')) + '</button>'
    + (a.tcpSecret ? '<button class="act danger" data-act="secretClear">' + t('secretClear') + '</button>' : '')
    + '<span class="sub">' + t('secretSub') + '</span></div>';

  if (!a.testBots) {
    $('botsUI').className = 'empty';
    $('botsUI').textContent = t('botsOff');
    return;
  }
  $('botsUI').className = '';
  const steps = [...new Set([0, 1, 5, 10, 20, a.botMax])].filter((n) => n <= a.botMax);
  $('botsUI').innerHTML =
    '<div class="row"><span class="lbl">' + t('botsActive') + '</span><b>' + a.bots + '</b>'
    + '<span class="sub">' + t('botsMax', a.botMax) + '</span></div>'
    + '<div class="row">' + steps.map((n) =>
        '<button class="act ' + (n === a.bots ? 'on' : '') + '" data-act="bots" data-count="' + n + '">'
        + (n === 0 ? t('botsStop') : t('botsCount', n)) + '</button>').join('')
    + '<button class="act" data-act="bots" data-count="' + Math.min(a.botMax, a.bots + 1) + '">+1</button>'
    + '<button class="act" data-act="bots" data-count="' + Math.max(0, a.bots - 1) + '">−1</button></div>';
}

// --- salons ------------------------------------------------------------------
// A flat player list hides the failure that actually ruins an evening: several
// rooms of two or three, each convinced voice is broken.
// --- équipes -----------------------------------------------------------------
// Groups live in the relay's memory for one evening. This panel is the only way
// to change them, and every change is pushed to the open browsers immediately,
// so a colour or a voice toggle lands mid-race without anyone reloading.
let teamsDrawn = null; // last state drawn, so a poll never rebuilds under a click
let teamsState = { teams: [], members: {} };

function renderTeams(data) {
  const canAct = !!(data.actions && data.actions.enabled);
  const tp = data.teams || { teams: [], members: {} };
  teamsState = tp;
  // Assignable players are whoever the relay currently sees, in a stable order:
  // the list is rebuilt every 2 s and must not jump around under the cursor.
  const logins = [];
  (data.rooms || []).forEach((r) => (r.players || []).forEach((p) => logins.push(p.login)));
  logins.sort();

  const key = JSON.stringify([canAct, tp, logins]);
  if (key === teamsDrawn) return;
  teamsDrawn = key;

  if (!canAct) {
    $('teamsUI').className = 'empty';
    $('teamsUI').textContent = t('actionsOff');
    return;
  }
  $('teamsUI').className = '';

  // The colour comes from the relay's own palette, but it is going into a style
  // attribute: check the shape rather than trust it.
  const swatch = (c) => (/^#[0-9a-f]{6}$/i.test(String(c)) ? c : '#888888');
  const options = (sel) => '<option value=""' + (sel ? '' : ' selected') + '>' + t('teamNone') + '</option>'
    + tp.teams.map((tm) => '<option value="' + esc(tm.id) + '"' + (sel === tm.id ? ' selected' : '')
        + '>' + esc(tm.name) + '</option>').join('');

  const rows = tp.teams.length ? tp.teams.map((tm) => {
    const members = logins.filter((l) => tp.members[l] === tm.id);
    return '<div class="team"><span class="sw" style="background:' + swatch(tm.color) + '"></span>'
      + '<span class="nm">' + esc(tm.name) + '</span>'
      + '<button class="act ' + (tm.voice ? 'on' : '') + '" data-act="teamVoice" data-id="' + esc(tm.id) + '">'
      + (tm.voice ? t('teamVoiceOn') : t('teamVoiceOff')) + '</button>'
      + '<button class="act danger" data-act="teamRemove" data-id="' + esc(tm.id) + '">' + t('teamRemove') + '</button>'
      + '<span class="sub">' + (members.length ? members.map(esc).join(', ') : t('nobody')) + '</span></div>';
  }).join('') : '<div class="empty">' + t('teamsEmpty') + '</div>';

  const assign = logins.length
    ? logins.map((l) => '<div class="team"><span class="nm">' + esc(l) + '</span>'
        + '<select data-assign="' + esc(l) + '">' + options(tp.members[l] || '') + '</select></div>').join('')
    : '<div class="empty">' + t('noPlayers') + '</div>';

  $('teamsUI').innerHTML =
    '<div class="row"><span class="lbl">' + t('teamAuto') + '</span>'
    + [2, 3, 4, 5, 6].map((n) =>
        '<button class="act" data-act="teamAuto" data-count="' + n + '">' + t('teamCount', n) + '</button>').join('')
    + '<span class="sub">' + t('teamAutoSub') + '</span></div>'
    + '<div class="row"><span class="lbl">' + t('teamManual') + '</span>'
    + '<button class="act" data-act="teamCreate">' + t('teamAdd') + '</button>'
    + '<button class="act danger" data-act="teamClear">' + t('teamClear') + '</button></div>'
    + rows
    + '<div class="lbl" style="margin-top:14px">' + t('playersLabel') + '</div>'
    + assign;
}

// Delegated on the document, like the other panels: this list is rebuilt on
// every state change and per-select listeners would pile up.
document.addEventListener('change', (e) => {
  const sel = e.target.closest('select[data-assign]');
  if (!sel) return;
  act('teams', { op: 'assign', login: sel.dataset.assign, id: sel.value });
});

// Built from location.origin, never from a hardcoded domain: the same page is
// served on localhost during development and on the public host, and a link
// you paste into Discord has to carry the right one.
//
// The "privé" rows are here on purpose — this page already required the admin
// password to load — but they are labelled, because the whole point is that
// the public ones get copied out and these ones do not.
function renderLinks(data) {
  const o = location.origin;
  const rows = [
    [t('link.client'), o + '/', false, t('link.clientNote')],
    [t('link.check'), o + '/check', false, t('link.checkNote')],
    [t('link.health'), o + '/health', false, t('link.healthNote')],
    [t('link.admin'), o + '/admin', true, t('link.adminNote')],
    [t('link.log'), o + '/admin/events.log', true, t('link.logNote')],
    [t('link.state'), o + '/admin/state.json', true, t('link.stateNote')],
  ];
  if (data.calibrationBot) {
    rows.push([t('link.bot'), o + '/bot.html', true, t('link.botNote')]);
  }

  $('links').innerHTML = rows.map(([label, url, priv, note]) =>
    '<div class="lnk">'
    + '<div><b>' + esc(label) + '</b> <span class="tag' + (priv ? ' priv' : '') + '">'
    + (priv ? t('private') : t('public')) + '</span></div>'
    + '<div class="lnk-u"><a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a>'
    + '<button class="copy" data-copy="' + esc(url) + '">' + t('copy') + '</button></div>'
    + '<div class="note">' + esc(note) + '</div>'
    + '</div>'
  ).join('');
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-copy]');
  if (!btn) return;
  const url = btn.getAttribute('data-copy');
  try {
    await navigator.clipboard.writeText(url);
    btn.textContent = t('copied');
  } catch (err) {
    // Clipboard permission is refused often enough that a silent no-op would
    // look like a broken button. Select the text instead so Ctrl+C works.
    const a = btn.previousElementSibling;
    if (a) {
      const r = document.createRange();
      r.selectNodeContents(a);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    }
    btn.textContent = 'Ctrl+C';
  }
  setTimeout(() => { btn.textContent = t('copy'); }, 2000);
});

// --- expulsion d'un joueur nommé ---------------------------------------------
// /kick only removes a LiveKit ghost — an identity with nobody behind it. This
// is the other case, the one that actually comes up: a real player, connected
// on both halves, who has to stop being audible now.
function ejectBtn(login) {
  return '<button class="act danger" data-eject="' + esc(login) + '">' + t('eject') + '</button>';
}

function ejectFlow(login) {
  // Asked rather than fixed at 15 min: "he is shouting" and "he is streaming
  // the event" do not want the same duration, and the answer is obvious to the
  // person clicking and to nobody else.
  const raw = prompt(t('ejectPrompt', login), '15');
  if (raw === null) return;
  const minutes = Number(raw.trim());
  if (!isFinite(minutes) || minutes < 0) { alert(t('badDuration')); return; }
  act('eject', { login: login, minutes: minutes });
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-eject]');
  if (btn) { ejectFlow(btn.dataset.eject); return; }
  const un = e.target.closest('button[data-unblock]');
  if (un) { act('unblock', { login: un.dataset.unblock }); return; }
  const ub = e.target.closest('button[data-unban]');
  if (ub) {
    const login = ub.dataset.unban;
    if (confirm(t('banRemoveConfirm', login))) act('ban', { login: login, remove: true });
  }
});

// --- liste noire -------------------------------------------------------------
// The other half of an eject, and deliberately not the same control: a ban is
// typed in before the evening starts, for someone who is very probably not
// connected yet, and it does not lapse on its own.
async function banFlow() {
  const login = $('banLogin').value.trim();
  if (!login) { alert(t('banNoLogin')); $('banLogin').focus(); return; }
  if (!confirm(t('banConfirm', login))) return;
  const body = await act('ban', { login: login, reason: $('banReason').value.trim() });
  if (!body) return;
  $('banLogin').value = '';
  $('banReason').value = '';
  $('banLogin').focus(); // three or four to type in a row, not one
  // A ban that did not reach the disk still works tonight and is gone tomorrow.
  // Saying so here is the only place anyone would find out.
  if (body.saveError) alert(t('banSaveFailed', body.saveError));
}

$('banBtn').addEventListener('click', banFlow);
// Enter in either field: typing a login and reaching for the mouse for every
// name on the list is the sort of thing you only notice at the fourth one.
for (const id of ['banLogin', 'banReason']) {
  $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') banFlow(); });
}

let bansDrawn = null; // same memo as the other panels: never redraw mid-click

function renderBans(rows, canAct, hasFile) {
  const el = $('bansUI');
  $('banForm').hidden = !canAct;
  if (!canAct) { el.className = 'empty'; el.textContent = t('actionsOffShort'); bansDrawn = null; return; }
  const key = JSON.stringify([rows, hasFile, lang]);
  if (key === bansDrawn) return;
  bansDrawn = key;
  el.className = '';
  const warn = hasFile ? '' : '<div class="note" style="color: var(--warn)">' + t('banFileWarn') + '</div>';
  el.innerHTML = warn + (rows.length
    ? rows.map((b) => '<div class="row"><span class="lbl">' + esc(b.login) + '</span>'
        + '<span class="sub">' + t('bannedSince', new Date(b.since).toLocaleDateString(locale()))
        + (b.reason ? ' — ' + esc(b.reason) : '') + '</span>'
        + '<button class="act" data-unban="' + esc(b.login) + '">' + t('banRemove') + '</button></div>').join('')
    : '<div class="empty">' + t('nobodyBanned') + '</div>');
}

function renderBlocked(rows, canAct) {
  const el = $('blockedUI');
  if (!canAct) { el.className = 'empty'; el.textContent = t('actionsOffShort'); return; }
  el.className = '';
  el.innerHTML = rows.length
    ? rows.map((b) => '<div class="row"><span class="lbl">' + esc(b.login) + '</span>'
        + '<span class="sub">' + t('minutesLeft', Math.max(1, Math.ceil(b.secondsLeft / 60))) + '</span>'
        + '<button class="act" data-unblock="' + esc(b.login) + '">' + t('unblock') + '</button></div>').join('')
    : '<div class="empty">' + t('nobodyBlocked') + '</div>';
}

function renderRooms(rooms, canAct) {
  if (!rooms.length) { $('rooms').innerHTML = '<div class="empty">' + t('noRooms') + '</div>'; return; }
  $('rooms').innerHTML = '<div class="rooms">' + rooms.map((r) => {
    const players = r.players.map((p) =>
      '<span class="who ' + (p.paired ? '' : 'half') + '">' + esc(p.login)
      + (p.half === 'plugin' ? ' <span class="dim">' + t('noTab') + '</span>'
        : p.half === 'browser' ? ' <span class="dim">' + t('noGame') + '</span>' : '')
      + (canAct ? ' ' + ejectBtn(p.login) : '') + '</span>'
    ).join('') || '<span class="empty">' + t('nobodyRelay') + '</span>';
    const lk = r.livekit === null ? '<span class="dim">' + t('livekitUnknown') + '</span>'
      : '<span class="dim">' + t('livekitCount', r.livekit) + '</span>';
    // A ghost is the one thing on this page you can act on one at a time:
    // the button is right next to the name so the room is never in doubt.
    const ghosts = r.ghosts.length
      ? '<div class="ghost">' + t('ghosts') + r.ghosts.map((g) =>
          esc(g) + (canAct
            ? '<button class="act danger kick" data-room="' + esc(r.room) + '" data-identity="' + esc(g) + '">'
              + t('eject') + '</button>'
            : '')).join(' ') + '</div>' : '';
    const missing = r.missing.length
      ? '<div class="warn">' + t('missing') + r.missing.map(esc).join(', ') + '</div>' : '';
    return '<div class="room"><h3>' + esc(r.serverName || r.room) + '</h3>'
      + '<div class="sub">' + t('playerCount', r.players.length) + ' · ' + lk + '</div>'
      + '<div>' + players + '</div>' + ghosts + missing + '</div>';
  }).join('') + '</div>';
}

// Delegated once, on the container: the room cards are rebuilt every 2 s and
// per-button listeners would be re-attached (and leak) on every poll.
$('rooms').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-identity]');
  if (!btn) return;
  if (!confirm(t('kickConfirm', btn.dataset.identity, btn.dataset.room))) return;
  act('kick', { room: btn.dataset.room, identity: btn.dataset.identity });
});

// --- historique --------------------------------------------------------------
// Answers "it dropped — when?" without reading the log line by line.
function renderSpark(history) {
  const el = $('spark');
  if (history.length < 2) {
    el.innerHTML = '';
    $('sparkLegend').textContent = t('sparkThin');
    return;
  }
  const W = 600, H = 90, max = Math.max(1, ...history.map((h) => Math.max(h.paired, h.plugins)));
  const x = (i) => (i / (history.length - 1)) * W;
  const y = (v) => H - 4 - (v / max) * (H - 12);
  const path = (key) => history.map((h, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(h[key]).toFixed(1)).join(' ');
  el.innerHTML =
    '<path class="area" d="' + path('paired') + ' L' + W + ' ' + H + ' L0 ' + H + ' Z"></path>'
    + '<path class="line2" d="' + path('plugins') + '"></path>'
    + '<path class="line" d="' + path('paired') + '"></path>';
  const span = Math.round((history[history.length - 1].t - history[0].t) / 60000);
  $('sparkLegend').innerHTML = t('sparkLegend', max, span);
}

// --- filtre du journal -------------------------------------------------------
// The window is deliberately long: on the night the question is "what happened
// twenty minutes ago", and a few minutes of history makes the filter useless.
// It is affordable because the poll asks the relay for new lines only — see
// eventCursor below — so the size costs one fetch on load, not one every 2 s.
const EVENTS_MAX = 1000;
let allEvents = [];   // newest first, same order as the relay sends
let eventCursor = null; // last seq seen; null asks for a full window
$('filter').addEventListener('input', renderEvents);

function renderEvents() {
  const q = $('filter').value.trim().toLowerCase();
  const shown = q
    ? allEvents.filter((e) => JSON.stringify(e).toLowerCase().includes(q))
    : allEvents;
  $('filterCount').textContent = q ? shown.length + '/' + allEvents.length : '';
  $('events').innerHTML = shown.map((e) => {
    // `seq` is the cursor the poll uses, not something to show on the line.
    const { ts, event, seq, ...rest } = e;
    const cls = event.includes('Failed') || event.includes('Rejected') || event === 'admin.denied'
      ? 'bad' : (event === 'report' ? 'warn' : '');
    const fields = Object.entries(rest).map(([k, v]) => k + '=' + esc(v)).join(' ');
    return '<div><span class="dim">' + time(ts) + '</span> '
      + '<span class="ev ' + cls + '">' + esc(event) + '</span> '
      + '<span class="dim">' + fields + '</span></div>';
  }).join('') || '<div class="empty">' + (q ? t('noMatch') : t('nothingYet')) + '</div>';
}

async function poll() {
  let data;
  try {
    const qs = [];
    if (eventCursor !== null) qs.push('sinceEvent=' + eventCursor);
    if (reportCursor !== null) qs.push('sinceReport=' + reportCursor);
    const url = '/admin/state.json' + (qs.length ? '?' + qs.join('&') : '');
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (err) {
    $('stale').textContent = t('relayUnreachable', err.message);
    return;
  }
  $('stale').textContent = '';
  lastOk = Date.now();

  const c = data.counts;
  $('meta').textContent = time(data.now) + t('upFor', fmtAge(data.uptimeSeconds));
  $('debugBanner').hidden = !data.debugMode;

  $('cards').innerHTML = [
    [t('card.paired'), c.paired, 'hl'],
    [t('card.pluginOnly'), c.pluginOnly, c.pluginOnly > 0 ? 'warn' : ''],
    [t('card.browserOnly'), c.browserOnly, c.browserOnly > 0 ? 'warn' : ''],
    [t('card.plugins'), c.plugins, ''],
    [t('card.browsers'), c.browsers, ''],
    [t('card.nonces'), c.nonces, ''],
  ].map(([label, value, cls]) =>
    '<div class="card ' + cls + '"><b>' + value + '</b><span>' + label + '</span></div>'
  ).join('');

  // Counting the unpaired is useless on the night: you need the name to call
  // it out on Discord. Plugin-without-tab first — that one is silent in-game.
  const noTab = data.plugins.filter((p) => !p.paired).map((p) => p.login);
  const noGame = data.browsers.filter((b) => !b.paired).map((b) => b.login);
  const names = (list) => list.map((l) => '<span class="who">' + esc(l) + '</span>').join(', ');
  $('unpaired').hidden = !noTab.length && !noGame.length;
  $('unpaired').innerHTML =
    (noTab.length ? '<div><b>' + t('unpairedNoTab') + '</b> ' + names(noTab) + '</div>' : '')
    + (noGame.length ? '<div><b>' + t('unpairedNoGame') + '</b> ' + names(noGame) + '</div>' : '');

  // The eject column only exists when the relay would accept the click: a
  // button that always answers 404 teaches people to ignore buttons.
  const canAct = (data.actions || {}).enabled === true;
  lastCanAct = canAct;
  const ejectCol = canAct ? [''] : [];
  const ejectCell = (login) => canAct ? '<td>' + ejectBtn(login) + '</td>' : '';

  table($('plugins'), [t('col.login'), t('col.version'), t('col.room'), t('col.position'), t('col.connected')].concat(ejectCol), data.plugins, (p) =>
    '<tr><td class="login">' + esc(p.login) + '</td>'
    + '<td>' + (p.version ? esc(p.version) : '<span class="warn">?</span>') + '</td>'
    + '<td>' + esc(p.serverName || p.room || '—') + '</td>'
    + '<td class="' + ageClass(p.positionAgeSeconds) + '">' + fmtAge(p.positionAgeSeconds) + '</td>'
    + '<td class="dim">' + fmtAge(p.connectedSeconds) + '</td>' + ejectCell(p.login) + '</tr>'
  );

  table($('browsers'), [t('col.login'), t('col.room')].concat(ejectCol), data.browsers, (b) =>
    '<tr><td class="login">' + esc(b.login) + '</td>'
    + '<td>' + esc(b.room || '—') + '</td>' + ejectCell(b.login) + '</tr>'
  );

  // Someone reconnecting eight times in five minutes is the real problem of
  // the night, but in the flat feed it looks like eight ordinary lines.
  table($('reconnects'), [t('col.login'), t('col.game'), t('col.tab'), t('col.total')], data.reconnects || [], (r) =>
    '<tr><td class="login">' + esc(r.login) + '</td>'
    + '<td>' + r.plugin + '</td><td>' + r.browser + '</td>'
    + '<td class="' + (r.total >= 5 ? 'bad' : 'warn') + '">' + r.total + '</td></tr>'
  );

  renderActions(data.actions || { enabled: false }, data.debugMode === true);
  // Outside renderActions on purpose: that one is memoised on its payload, and
  // a countdown that only refreshes when the actions block changes is a clock
  // that stops.
  renderBlocked(data.blocked || [], canAct);
  renderBans(data.bans || [], canAct, !!data.banFile);
  renderTeams(data);
  renderLinks(data);
  renderRooms(data.rooms || [], canAct);
  renderSpark(data.history || []);
  $('lkBanner').hidden = data.livekitOk !== false;
  $('lkBanner').innerHTML = t('livekitDown')
    + '<span class="dim">' + esc(data.livekitError || '') + '</span>';

  // Only redrawn when the relay says something moved: rebuilding this list on
  // every poll would fight the text you are half-way through selecting out of
  // a report to paste into Discord.
  if (data.reportsChanged) {
    allReports = data.reports;
    renderReports(canAct);
    noteReports(allReports);
  }
  if (typeof data.reportSeq === 'number') reportCursor = data.reportSeq;

  // Full window on the first poll, and again whenever the relay says our cursor
  // fell out of its ring (a restart, or a burst longer than the window). The
  // rest of the time this is a handful of lines, or none at all.
  if (data.eventsFull) allEvents = data.events;
  else if (data.events.length) allEvents = data.events.concat(allEvents).slice(0, EVENTS_MAX);
  if (typeof data.eventSeq === 'number') eventCursor = data.eventSeq;
  renderEvents();
}

poll();
setInterval(poll, 2000);
// A page that silently stopped refreshing is worse than one that says so:
// during the event this is glanced at, not read.
setInterval(() => {
  if (lastOk && Date.now() - lastOk > 15000) {
    $('stale').textContent = t('frozen', Math.round((Date.now() - lastOk) / 1000));
  }
}, 3000);
</script>
</body>
</html>
