<!doctype html>
<html lang="en" data-onz-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OnZVoIP — check</title>
<link rel="stylesheet" href="styles.css" />
<style>
/* Deliberately standalone: this page has to work when the main client is the
   thing that is broken, so it borrows only the theme tokens from styles.css
   and draws the rest itself. No modules, no LiveKit, no imports — one file
   the player can load even on a bad connection. */
body { margin:0; background:var(--onz-bg); color:var(--onz-text);
  font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
.wrap { max-width:640px; margin:0 auto; padding:24px 16px 64px; }
.head { display:flex; align-items:baseline; gap:12px; }
h1 { font-size:20px; margin:0 0 4px; flex:1; }
.lede { color:var(--onz-muted); margin:0 0 20px; }
.lang { display:flex; gap:4px; }
.lang button { padding:3px 9px; font-size:12px; }
.lang button[aria-pressed="true"] { border-color:var(--onz-accent); color:var(--onz-accent); }
.check { display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--onz-row-border); }
.check:first-of-type { border-top:0; }
.dot { flex:0 0 auto; width:20px; height:20px; border-radius:50%; margin-top:2px;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
  background:var(--onz-surface); color:var(--onz-muted2); border:1px solid var(--onz-border3); }
.dot.ok { background:var(--onz-mic-live-bg); color:var(--onz-mic-live-text); border-color:var(--onz-mic-live-border); }
.dot.bad { background:#3a1a1a; color:#e88; border-color:#7a3a3a; }
.dot.warn { background:var(--onz-expired-bg); color:var(--onz-warn); border-color:var(--onz-expired-border); }
.dot.run { animation:pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity:.35; } }
@media (prefers-reduced-motion:reduce) { .dot.run { animation:none; } }
.body { flex:1; min-width:0; }
.name { font-weight:600; }
.detail { color:var(--onz-muted); }
.fix { margin-top:6px; padding:8px 10px; border-radius:6px;
  background:var(--onz-expired-bg); border:1px solid var(--onz-expired-border); color:var(--onz-text); }
button { font:inherit; cursor:pointer; padding:8px 14px; border-radius:6px;
  background:var(--onz-surface); color:var(--onz-text); border:1px solid var(--onz-border3); }
button:hover { border-color:var(--onz-accent); }
button.primary { background:var(--onz-accent-dim); border-color:var(--onz-accent-dim); color:#fff; }
button.primary:hover { background:var(--onz-accent-hover); border-color:var(--onz-accent-hover); }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:24px; }
.meter { display:flex; gap:2px; height:22px; align-items:flex-end; margin-top:8px; }
.meter i { flex:1; background:var(--onz-mic-idle-bg); border-radius:1px; height:35%; }
.meter i.on { background:var(--onz-teal); }
.foot { margin-top:28px; color:var(--onz-muted2); font-size:12px; }
.foot a { color:var(--onz-accent); }
.links { margin-top:20px; border-top:1px solid var(--onz-row-border); padding-top:12px; }
.links .lbl { color:var(--onz-muted2); font-size:12px; }
.link { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; font-size:12px; }
.link a { color:var(--onz-accent); min-width:130px; }
.link code { color:var(--onz-muted); font:12px/1.4 ui-monospace,Consolas,monospace; }
button.mini { padding:2px 8px; font-size:11px; }
textarea { width:100%; height:160px; margin-top:12px; font:12px/1.4 ui-monospace,Consolas,monospace;
  background:var(--onz-input-bg); color:var(--onz-text); border:1px solid var(--onz-border3);
  border-radius:6px; padding:8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1 id="t-title"></h1>
    <div class="lang">
      <button id="lang-en" aria-pressed="false">EN</button>
      <button id="lang-fr" aria-pressed="false">FR</button>
    </div>
  </div>
  <p class="lede" id="t-lede"></p>

  <div id="checks"></div>

  <div class="actions">
    <button class="primary" id="mic"></button>
    <button id="again"></button>
    <button id="copy"></button>
  </div>

  <p class="foot"><span id="t-foot"></span> <a href="/" id="t-back"></a></p>

  <!-- Only the two pages every player may open. The admin dashboard and the
       calibration bot are deliberately absent: this page is public. -->
  <div class="links">
    <span class="lbl" id="t-links"></span>
    <div class="link">
      <a id="l-voice" href="/"></a><code id="u-voice"></code>
      <button class="mini" data-copy="u-voice"></button>
    </div>
    <div class="link">
      <a id="l-check" href="/check"></a><code id="u-check"></code>
      <button class="mini" data-copy="u-check"></button>
    </div>
  </div>

  <textarea id="out" hidden readonly></textarea>
</div>

// Order of preference: an explicit ?lang=, then a saved choice, then the
// browser. Someone who flipped the toggle should not have to flip it again
// on their next visit.
function pickLang() {
  var q = /[?&]lang=(fr|en)\b/i.exec(location.search);
  if (q) return q[1].toLowerCase();
  try {
    var saved = localStorage.getItem("onzvoip.lang");
    if (saved === "fr" || saved === "en") return saved;
  } catch (e) {}
  var list = navigator.languages && navigator.languages.length
    ? navigator.languages : [navigator.language || "en"];
  for (var i = 0; i < list.length; i++) {
    var tag = String(list[i]).toLowerCase();
    // "fr", "fr-FR", "fr-BE"… but not "frr" (Frisian) or "fry".
    if (tag === "fr" || tag.indexOf("fr-") === 0) return "fr";
  }
  return "en";
}

var LANG = pickLang();
function T(key) {
  var s = STR[LANG][key];
  return s === undefined ? STR.en[key] : s;
}

var CHECKS = ["secure", "relay", "livekit", "ws", "webrtc", "plugin", "mic"];

// Results are stored as translation keys plus their arguments, never as
// finished text, so flipping the language re-renders what already ran
// instead of leaving half the page in the other language.
var state = {};
var host = document.getElementById("checks");
var els = {};

// detail and fix are arrays. Each item is either a translation key, or an
// object {raw: "..."} for values that must not be translated: a login, a
// version number, a device label, a browser error name.
function set(id, status, detail, fix) {
  state[id] = { status: status, detail: detail || [], fix: fix || null };
  paint(id);
}

function join(parts) {
  if (!parts) return "";
  return parts.map(function (p) {
    return p && typeof p === "object" ? String(p.raw) : T(p);
  }).join("");
}

function paint(id) {
  var e = els[id];
  var s = state[id];
  if (!e || !s) return;
  var glyph = { wait: "·", run: "…", ok: "✓", warn: "!", bad: "✕" }[s.status] || "·";
  e.dot.className = "dot" + (s.status === "wait" ? "" : " " + s.status);
  e.dot.textContent = glyph;
  e.name.textContent = T("n_" + id);
  e.detail.textContent = join(s.detail);
  var fixText = s.fix ? join(s.fix) : "";
  e.fix.hidden = !fixText;
  e.fix.textContent = fixText;
}

CHECKS.forEach(function (id) {
  var row = document.createElement("div");
  row.className = "check";
  row.innerHTML = '<div class="dot" data-dot>·</div><div class="body">'
    + '<div class="name"></div><div class="detail"></div>'
    + '<div class="fix" hidden></div></div>';
  host.appendChild(row);
  els[id] = {
    dot: row.querySelector("[data-dot]"),
    name: row.querySelector(".name"),
    detail: row.querySelector(".detail"),
    fix: row.querySelector(".fix"),
    body: row.querySelector(".body")
  };
  set(id, "wait", ["waiting"]);
});

function applyLang() {
  document.documentElement.lang = LANG;
  document.title = LANG === "fr" ? "OnZVoIP — vérification" : "OnZVoIP — check";
  document.getElementById("t-title").textContent = T("title");
  document.getElementById("t-lede").textContent = T("lede");
  document.getElementById("mic").textContent = T("micBtn");
  document.getElementById("again").textContent = T("again");
  document.getElementById("copy").textContent = T("copy");
  document.getElementById("t-foot").textContent = T("foot");
  document.getElementById("t-back").textContent = T("back");
  document.getElementById("t-links").textContent = T("links");
  document.getElementById("l-voice").textContent = T("linkVoice");
  document.getElementById("l-check").textContent = T("linkCheck");
  document.querySelectorAll("button[data-copy]").forEach(function (b) {
    b.textContent = T("copyLink");
  });
  document.getElementById("lang-en").setAttribute("aria-pressed", String(LANG === "en"));
  document.getElementById("lang-fr").setAttribute("aria-pressed", String(LANG === "fr"));
  CHECKS.forEach(paint);
}

function setLang(next) {
  if (next === LANG) return;
  LANG = next;
  try { localStorage.setItem("onzvoip.lang", next); } catch (e) {}
  applyLang();
}

document.getElementById("lang-en").addEventListener("click", function () { setLang("en"); });
document.getElementById("lang-fr").addEventListener("click", function () { setLang("fr"); });

function nonce() {
  var m = /[?&]t=([^&]+)/.exec(location.search);
  return m ? decodeURIComponent(m[1]) : "";
}

function checkSecure() {
  if (window.isSecureContext) {
    set("secure", "ok", [{ raw: location.protocol + "//" + location.host }]);
    return;
  }
  set("secure", "bad", ["notHttps"], ["fixHttps"]);
}

async function checkRelay() {
  set("relay", "run", ["running"]);
  set("livekit", "run", ["running"]);
  set("plugin", "run", ["running"]);
  var t = nonce();
  var url = "/check.json" + (t ? "?t=" + encodeURIComponent(t) : "");
  var data;
  try {
    var res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
  } catch (err) {
    set("relay", "bad", ["unreachable", { raw: " (" + err.message + ")" }], ["fixRelay"]);
    set("livekit", "bad", ["skipped"]);
    set("plugin", "bad", ["skipped"]);
    return;
  }
  set("relay", "ok", ["answers"]);
  if (data.livekit) set("livekit", "ok", ["answers"]);
  else set("livekit", "bad", ["noLivekit"], ["fixLivekit"]);
  paintPlugin(data.plugin || { checked: false });
}

function paintPlugin(p) {
  if (!p.checked) {
    set("plugin", "warn", ["notTested"], ["fixNoNonce"]);
    return;
  }
  if (!p.ok) {
    set("plugin", "bad", [p.reason === "expired" ? "expired" : "unknown"], ["fixNonce"]);
    return;
  }
  var who = [{ raw: p.login }];
  if (p.serverName) who.push("on", { raw: p.serverName });
  if (!p.connected) {
    set("plugin", "warn", who.concat(["disconnected"]), ["fixDisconnected"]);
    return;
  }
  if (p.version) who.push("version", { raw: p.version });
  set("plugin", "ok", who);
}

function checkWs() {
  set("ws", "run", ["running"]);
  return new Promise(function (resolve) {
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    var ws;
    var done = false;
    var finish = function (status, detail, fix) {
      if (done) return;
      done = true;
      set("ws", status, detail, fix);
      try { if (ws) ws.close(); } catch (e) {}
      resolve();
    };
    var timer = setTimeout(function () {
      finish("bad", ["wsTimeout"], ["fixWs"]);
    }, 8000);
    try {
      ws = new WebSocket(proto + "//" + location.host + "/ingest");
    } catch (err) {
      clearTimeout(timer);
      finish("bad", ["wsRefused"], ["fixWs"]);
      return;
    }
    ws.addEventListener("open", function () { clearTimeout(timer); finish("ok", ["wsOpen"]); });
    ws.addEventListener("error", function () {
      clearTimeout(timer);
      finish("bad", ["wsRefused"], ["fixWs"]);
    });
  });
}

// Gathers ICE candidates against no STUN server on purpose: this checks that
// the browser can do WebRTC at all (host candidates), not that it can reach
// the internet — the WebSocket test above already covers the network, and
// asking an external STUN would fail on exactly the restricted networks
// where LiveKit still works fine through the relay.
function checkWebrtc() {
  set("webrtc", "run", ["running"]);
  return new Promise(function (resolve) {
    var PC = window.RTCPeerConnection;
    if (!PC) {
      set("webrtc", "bad", ["noWebrtc"], ["fixNoWebrtc"]);
      resolve();
      return;
    }
    var pc = new PC({ iceServers: [] });
    var found = 0;
    var done = false;
    var finish = function () {
      if (done) return;
      done = true;
      try { pc.close(); } catch (e) {}
      if (found > 0) set("webrtc", "ok", [{ raw: String(found) }, found > 1 ? "routesN" : "routes1"]);
      else set("webrtc", "bad", ["noRoute"], ["fixNoRoute"]);
      resolve();
    };
    var timer = setTimeout(finish, 6000);
    pc.addEventListener("icecandidate", function (e) {
      if (e.candidate) found++;
      else { clearTimeout(timer); finish(); }
    });
    try {
      pc.createDataChannel("onz");
      pc.createOffer().then(function (o) { return pc.setLocalDescription(o); }).catch(function () {
        clearTimeout(timer);
        finish();
      });
    } catch (err) {
      clearTimeout(timer);
      finish();
    }
  });
}

var micStream = null;
var micRaf = null;
var meter = null;

function stopMic() {
  if (micRaf) cancelAnimationFrame(micRaf);
  micRaf = null;
  if (micStream) micStream.getTracks().forEach(function (t) { t.stop(); });
  micStream = null;
}

async function checkMic() {
  stopMic();
  set("mic", "run", ["allowMic"]);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    set("mic", "bad", ["noMicApi"], ["fixNoMicApi"]);
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    var n = err && err.name;
    if (n === "NotAllowedError") set("mic", "bad", ["micDenied"], ["fixMicDenied"]);
    else if (n === "NotFoundError" || n === "DevicesNotFoundError") set("mic", "bad", ["micNone"], ["fixMicNone"]);
    else if (n === "NotReadableError") set("mic", "bad", ["micBusy"], ["fixMicBusy"]);
    else set("mic", "bad", ["micErr", { raw: n || "?" }]);
    return;
  }
  var track = micStream.getAudioTracks()[0];
  // The device label is whatever the OS calls it, so it stays raw in both
  // languages; only the sentence around it is translated.
  var label = track && track.label ? { raw: track.label } : "micLabel";
  set("mic", "run", [label, "micSpeak"]);

  if (!meter) {
    meter = document.createElement("div");
    meter.className = "meter";
    for (var i = 0; i < 16; i++) meter.appendChild(document.createElement("i"));
    els.mic.body.appendChild(meter);
  }
  var bars = meter.querySelectorAll("i");

  var Ctx = window.AudioContext || window.webkitAudioContext;
  var ctx = new Ctx();
  var src = ctx.createMediaStreamSource(micStream);
  var analyser = ctx.createAnalyser();
  analyser.fftSize = 32;
  src.connect(analyser);
  var data = new Uint8Array(analyser.frequencyBinCount);
  var peak = 0;
  var startedAt = Date.now();

  var tick = function () {
    analyser.getByteFrequencyData(data);
    var sum = 0;
    for (var i = 0; i < data.length; i++) sum += data[i];
    var avg = sum / data.length;
    peak = Math.max(peak, avg);
    var level = Math.min(16, Math.round((avg / 255) * 16 * 1.6));
    for (var b = 0; b < bars.length; b++) bars[b].className = b < level ? "on" : "";
    // 8 s is long enough for someone to notice the meter and say something,
    // short enough that nobody wonders whether it is stuck.
    if (Date.now() - startedAt > 8000) {
      if (peak >= 12) set("mic", "ok", [label, "micHeard"]);
      else set("mic", "warn", [label, "micSilent"], ["fixMicSilent"]);
      // The bars stay where the last frame left them, so the result is
      // readable after the test rather than snapping back to idle.
      try { ctx.close(); } catch (e) {}
      stopMic();
      return;
    }
    micRaf = requestAnimationFrame(tick);
  };
  tick();
}

function diagnostic() {
  var lines = [T("diagTitle") + new Date().toISOString()];
  CHECKS.forEach(function (id) {
    var s = state[id] || {};
    var glyph = { wait: "·", run: "…", ok: "OK", warn: "!!", bad: "KO" }[s.status] || "?";
    var d = join(s.detail);
    lines.push("[" + glyph + "] " + T("n_" + id) + (d ? " — " + d : ""));
  });
  lines.push(T("browser") + navigator.userAgent);
  lines.push(T("screen") + screen.width + "x" + screen.height + T("langLine") + navigator.language);
  return lines.join("\n");
}

async function runAll() {
  checkSecure();
  await Promise.all([checkRelay(), checkWs(), checkWebrtc()]);
}

// Absolute URLs, built from wherever this page is actually served: the same
// file runs on localhost during development and on the public domain, and a
// link you paste into Discord has to carry the host with it.
document.getElementById("u-voice").textContent = location.origin + "/";
document.getElementById("u-check").textContent = location.origin + "/check";

document.querySelectorAll("button[data-copy]").forEach(function (btn) {
  btn.addEventListener("click", async function () {
    var text = document.getElementById(btn.getAttribute("data-copy")).textContent;
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = T("copied");
      setTimeout(function () { btn.textContent = T("copyLink"); }, 2000);
    } catch (err) {
      // Same reasoning as the diagnostic button: show it selectable rather
      // than report a clipboard permission the player cannot grant.
      var out = document.getElementById("out");
      out.hidden = false;
      out.value = text;
      out.select();
    }
  });
});

document.getElementById("again").addEventListener("click", function () { runAll(); });
document.getElementById("mic").addEventListener("click", function () { checkMic(); });
document.getElementById("copy").addEventListener("click", async function () {
  var text = diagnostic();
  var out = document.getElementById("out");
  try {
    await navigator.clipboard.writeText(text);
    this.textContent = T("copied");
    var btn = this;
    setTimeout(function () { btn.textContent = T("copy"); }, 2000);
  } catch (err) {
    // Clipboard access is denied often enough (Firefox without a gesture it
    // trusts, http origins) that falling back silently to a selectable box
    // beats an error the player cannot act on.
    out.hidden = false;
    out.value = text;
    out.select();
  }
});

applyLang();
runAll();
</script>
</body>
